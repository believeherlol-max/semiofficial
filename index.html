<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi Official</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        cursive: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .page-enter {
            animation: cinematicFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cinematicFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(8, 8, 11, 0.76);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .tab-content-wrapper {
            position: relative;
            width: 100%;
            display: grid;
            grid-template-areas: "content";
        }

        .tab-pane {
            grid-area: content;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.99);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        visibility 0.4s;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-pane.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .tiny-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            position: relative;
        }

        .tiny-dot-green {
            background-color: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        .tiny-dot-orange {
            background-color: #f97316;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.8);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        .tiny-dot-red {
            background-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .tab-btn {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            user-select: none;
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .interactive-row {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .interactive-row:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .download-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            user-select: none;
        }
        .download-btn:hover {
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Popup overlay animation */
        .popup-backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeInOverlay 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .popup-card {
            animation: scaleInPopup 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes scaleInPopup {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-6 selection:bg-white selection:text-black relative page-enter overflow-hidden">

    <canvas id="particleCanvas"></canvas>

    <!-- TIMED POP-UP OVERLAY CONTAINER -->
    <div id="popupOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 popup-backdrop hidden">
        <div class="glass-panel popup-card w-full max-w-sm p-6 rounded-3xl flex flex-col items-center text-center gap-4 relative shadow-2xl border border-white/20">
            <button onclick="closePopup()" class="absolute right-4 top-4 w-7 h-7 rounded-xl bg-white/[0.05] hover:bg-white/[0.12] border border-white/10 text-gray-400 hover:text-white flex items-center justify-center transition-all cursor-pointer">✕</button>
            <div id="popupImageContainer" class="w-full h-36 rounded-2xl overflow-hidden border border-white/10 hidden bg-black/40">
                <img id="popupImage" src="" alt="Popup Banner" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col gap-1 w-full">
                <h3 id="popupTitle" class="text-base font-bold text-white tracking-wide"></h3>
                <p id="popupMessage" class="text-xs text-gray-300 leading-relaxed"></p>
            </div>
            <div id="popupActionContainer" class="w-full pt-1">
                <a id="popupLink" href="#" target="_blank" class="download-btn w-full py-3 rounded-2xl bg-white text-black hover:bg-gray-100 font-bold text-[11px] tracking-wider uppercase flex items-center justify-center gap-2 shadow-xl">Open Link</a>
            </div>
        </div>
    </div>

    <div class="w-full max-w-lg mx-auto flex flex-col items-center justify-center gap-4 relative z-10 text-center my-auto px-6">
        <div class="glass-panel w-full p-8 sm:p-10 rounded-3xl flex flex-col items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-white shadow-xl mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Updating</h1>
            <p class="text-sm text-gray-400 leading-relaxed">We will be back online soon.</p>
        </div>
    </div>

    <script>
        let siteData = {
            staff: {
                owners: [
                    { name: 'y', id: '314643233625997313', avatar: 'https://media.discordapp.net/attachments/1482684122869665874/1535791322600833064/image.png?ex=6a790ca0&is=6a77bb20&hm=63b3ac82558c5fad5fe99c38f624bc2948a15826beb146c305921573b4f2a37b&=&format=webp&quality=lossless' }
                ],
                developers: [
                    { name: '$ Lux', id: '1163529621686460518', avatar: 'https://cdn.discordapp.com/avatars/1163529621686460518/0204e33a7ddc25b658128238f9a2c71f.webp?size=1024' }
                ],
                moderators: [
                    { name: 'merzi', id: '1515530887532380170', avatar: 'https://cdn.discordapp.com/avatars/1515530887532380170/a0e91ae073dfece3d2b85b3e5685cc10.webp?size=1024' }
                ]
            },
            popupConfig: {
                title: 'Special Announcement',
                message: 'Check out our latest updates and join our community channel!',
                imageUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=60',
                linkUrl: 'https://discord.gg/semi',
                timeUnit: 'minutes',
                timeValue: 1
            }
        };

        let popupTimer = null;

        function showPopup() {
            const overlay = document.getElementById('popupOverlay');
            const titleEl = document.getElementById('popupTitle');
            const msgEl = document.getElementById('popupMessage');
            const imgContainer = document.getElementById('popupImageContainer');
            const imgEl = document.getElementById('popupImage');
            const linkEl = document.getElementById('popupLink');

            titleEl.textContent = siteData.popupConfig.title;
            msgEl.textContent = siteData.popupConfig.message;
            linkEl.href = siteData.popupConfig.linkUrl;

            if (siteData.popupConfig.imageUrl) {
                imgEl.src = siteData.popupConfig.imageUrl;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            overlay.classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popupOverlay').classList.add('hidden');
        }

        function savePopupSettings() {
            siteData.popupConfig.title = document.getElementById('popupTitleInput').value.trim() || 'Notice';
            siteData.popupConfig.message = document.getElementById('popupMsgInput').value.trim() || '';
            siteData.popupConfig.imageUrl = document.getElementById('popupImageInput').value.trim() || '';
            siteData.popupConfig.linkUrl = document.getElementById('popupUrlInput').value.trim() || '#';
            siteData.popupConfig.timeUnit = document.getElementById('popupTimeUnit').value;
            siteData.popupConfig.timeValue = parseInt(document.getElementById('popupTimeValue').value) || 1;

            if (popupTimer) clearInterval(popupTimer);
            let intervalMs = 60000;
            const val = parseInt(siteData.popupConfig.timeValue) || 1;
            const unit = siteData.popupConfig.timeUnit;

            if (unit === 'seconds') {
                intervalMs = val * 1000;
            } else if (unit === 'minutes') {
                intervalMs = val * 60 * 1000;
            } else if (unit === 'hours') {
                intervalMs = val * 60 * 60 * 1000;
            }

            popupTimer = setInterval(() => {
                showPopup();
            }, intervalMs);

            alert('Pop-up configuration updated and timer started successfully!');
            showPopup();
        }

        function renderStaffDirectory() {
            const container = document.getElementById('staffDirectoryContainer');
            if (!container) return;

            const rolesConfig = [
                { key: 'owners', label: 'Owner' },
                { key: 'developers', label: 'Developers' },
                { key: 'moderators', label: 'Moderators' }
            ];

            let html = '';
            let hasStaff = false;

            rolesConfig.forEach(role => {
                const members = siteData.staff[role.key];
                if (members && members.length > 0) {
                    hasStaff = true;
                    html += `
                        <div class="flex flex-col gap-2.5">
                            <div class="text-[11px] font-mono uppercase tracking-widest text-gray-400 font-bold">${role.label}</div>
                            <div class="flex flex-col gap-2">
                    `;
                    members.forEach(m => {
                        html += `
                            <div class="flex items-center gap-3.5 p-3.5 rounded-2xl bg-white/[0.01] border border-white/[0.06] interactive-row">
                                <img src="${escapeHtml(m.avatar)}" class="w-9 h-9 rounded-full object-cover border border-white/20 shadow-md" alt="avatar">
                                <div class="flex flex-col">
                                    <span class="text-xs font-semibold text-white tracking-wide">${escapeHtml(m.name)}</span>
                                    <span class="text-[10px] font-mono text-gray-400">${escapeHtml(m.id)}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
            });

            if (!hasStaff) {
                html = `<div class="text-center text-gray-500 text-xs py-10 font-mono">No staff members added yet. Use Ctrl+X to open Admin Panel.</div>`;
            }

            container.innerHTML = html;
        }

        function addNewStaff() {
            const role = document.getElementById('newStaffRole').value;
            const name = document.getElementById('newStaffName').value.trim();
            const id = document.getElementById('newStaffId').value.trim();
            const avatar = document.getElementById('newStaffAvatar').value.trim();

            if (!name) return alert('Please enter a name.');

            siteData.staff[role].push({
                name: name,
                id: id || 'Staff Member',
                avatar: avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60'
            });

            renderStaffDirectory();
            document.getElementById('newStaffName').value = '';
            document.getElementById('newStaffId').value = '';
            document.getElementById('newStaffAvatar').value = '';
            alert('Staff member added successfully!');
        }

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resizeCanvas();

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resizeCanvas();
            }, 150);
        }, { passive: true });

        // Falling particles setup
        const particles = Array.from({ length: 70 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vy: Math.random() * 1.2 + 0.4,
            vx: (Math.random() - 0.5) * 0.4,
            radius: Math.random() * 1.8 + 0.6,
            alpha: Math.random() * 0.6 + 0.2
        }));

        function animateParticles(timestamp) {
            if (width !== window.innerWidth || height !== window.innerHeight) {
                resizeCanvas();
            }

            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += p.vy;
                p.x += p.vx;

                if (p.y > height + 10) {
                    p.y = -10;
                    p.x = Math.random() * width;
                }
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowBlur = 4;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        document.addEventListener("DOMContentLoaded", () => {
            renderStaffDirectory();
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-black', 'bg-white', 'shadow-md');
                btn.classList.add('text-gray-400');
            });

            const targetTab = document.getElementById(tabId);
            targetTab.classList.add('active');
            
            btnElement.classList.add('text-black', 'bg-white', 'shadow-md');
            btnElement.classList.remove('text-gray-400');

            if (tabId !== 'statusTab') {
                document.getElementById('adminPanel').style.display = 'none';
            }
            setTimeout(resizeCanvas, 50);
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
                e.preventDefault();
                switchTab('statusTab', document.querySelector('.tab-btn'));
                const panel = document.getElementById('adminPanel');
                panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
                if (panel.style.display === 'flex') {
                    setTimeout(() => document.getElementById('adminKey').focus(), 50);
                }
            }
        });

        function toggleAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function verifyKey() {
            const key = document.getElementById('adminKey').value;
            const msg = document.getElementById('adminMsg');
            if (key === 'catland123!!') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('dashboardView').style.display = 'flex';
            } else {
                msg.style.color = '#ffffff';
                msg.textContent = 'Invalid Passphrase';
            }
        }

        function changeStatus() {
            const name = document.getElementById('serviceSelect').value;
            const status = document.getElementById('statusSelect').value;

            document.querySelectorAll('#servicesContainer > div').forEach(row => {
                if (row.getAttribute('data-name') === name) {
                    const indicator = row.querySelector('.status-indicator');
                    const dot = indicator.querySelector('div');

                    indicator.setAttribute('data-status-key', status);
                    if (status === 'green') {
                        dot.className = 'tiny-dot tiny-dot-green';
                    } else if (status === 'orange') {
                        dot.className = 'tiny-dot tiny-dot-orange';
                    } else {
                        dot.className = 'tiny-dot tiny-dot-red';
                    }
                }
            });
        }
    </script>
</body>
</html>
