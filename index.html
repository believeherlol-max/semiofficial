<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#8203;</title>
    <link rel="icon" type="image/webp" href="https://cdn.discordapp.com/emojis/1258629630097752167.webp">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================
           ULTRA-PRIME OMEGA ARCHITECTURE V33
           ================================---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-user-drag: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            background-color: #010103;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            opacity: 0;
            animation: omegaEntrance 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes omegaEntrance {
            0% { opacity: 0; transform: scale(1.06); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); }
        }

        /* ==========================================
           IMMERSIVE CINEMATIC BACKGROUND & LIGHTING
           ================================---------- */
        .bg-system {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: #010103;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-video, .bg-image {
            position: absolute;
            inset: -40px;
            width: calc(100vw + 80px);
            height: calc(100vh + 80px);
            object-fit: cover; /* Changed from contain to cover so it fills the screen completely */
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* Ensures the fallback background image fills the entire area */
            filter: blur(5px) brightness(0.55) saturate(2.3); /* Brightness increased from 0.4 to 0.55 */
            transform: scale(1.15); /* Made the background PNG slightly bigger */
            pointer-events: none;
            will-change: transform;
            display: none;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(1,1,3,0.01) 0%, rgba(1,1,3,0.85) 100%);
            pointer-events: none;
        }

        .ambient-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.28;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .orb-1 { width: 500px; height: 500px; background: #6366f1; top: -150px; left: -150px; }
        .orb-2 { width: 600px; height: 600px; background: #a855f7; bottom: -180px; right: -180px; animation-delay: -4s; }
        .orb-3 { width: 400px; height: 400px; background: #38bdf8; top: 40%; left: 60%; animation-delay: -2s; opacity: 0.18; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 70px) scale(1.22); }
        }

        /* ==========================================
           TOP LEFT EXPANDING VOLUME WIDGET (CIRCULAR THUMB)
           ================================---------- */
        .top-left-volume-container {
            position: fixed;
            left: 30px;
            top: 30px;
            z-index: 99996;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 8px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 25px rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            gap: 0px;
            opacity: 0;
            pointer-events: none;
        }

        .top-left-volume-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .top-left-volume-container:hover {
            border-color: rgba(165, 180, 252, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 10px rgba(165, 180, 252, 0.08);
            padding: 8px 14px;
            gap: 12px;
            border-radius: 28px;
        }

        .volume-mute-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13px;
            cursor: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            transition: background 0.25s ease;
            flex-shrink: 0;
        }

        .volume-mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .volume-slider-wrapper {
            width: 0px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
        }

        .top-left-volume-container:hover .volume-slider-wrapper {
            width: 90px;
            opacity: 1;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: none !important;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: none !important;
            box-shadow: 0 0 8px #ffffff, 0 0 12px rgba(165, 180, 252, 0.6);
            border: 2px solid #010103;
        }

        .volume-percentage {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            width: 0px;
            overflow: hidden;
            opacity: 0;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin 0.4s ease;
            margin-left: 0px;
        }

        .top-left-volume-container:hover .volume-percentage {
            width: 30px;
            opacity: 1;
            margin-left: 6px;
        }

        /* ==========================================
           LOCKED TINY WHITE DOT CURSOR & SPARKLE TRAIL
           ================================---------- */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            box-shadow: 0 0 10px #ffffff, 0 0 16px rgba(165, 180, 252, 0.7);
            transform: translate(-50%, -50%);
            will-change: transform;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffffff 0%, rgba(165, 180, 252, 0.85) 60%, transparent 100%);
            border-radius: 50%;
            z-index: 99998;
            box-shadow: 0 0 6px #ffffff, 0 0 10px rgba(165, 180, 252, 0.7);
            animation: sparklePhysics 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes sparklePhysics {
            0% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.1) rotate(180deg) translateY(calc(var(--rand-y) * 1px)) translateX(calc(var(--rand-x) * 1px)); opacity: 0; }
        }

        /* ==========================================
           SPLASH SCREEN
           ================================---------- */
        .splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(1, 1, 3, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99990;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s ease;
        }

        .splash-content {
            text-align: center;
            position: relative;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 20px;
            cursor: none !important;
        }

        .splash-content p {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: none;
            animation: textBreath 2.2s ease-in-out infinite alternate;
        }

        @keyframes textBreath {
            0% { opacity: 0.6; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        .splash-screen.fade-out {
            opacity: 0;
            transform: scale(1.08);
            filter: blur(20px);
            pointer-events: none;
        }

        /* ==========================================
           STORY VIEWER MODAL
           ================================---------- */
        .story-modal {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(1, 1, 3, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 99995;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .story-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .story-container {
            position: relative;
            width: 400px;
            height: 690px;
            background: rgba(6, 6, 12, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 35px rgba(165, 180, 252, 0.15);
            display: flex;
            flex-direction: column;
            transform: scale(0.85) translateY(25px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .story-modal.active .story-container {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .story-progress-bars {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .story-progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            overflow: hidden;
        }

        .story-progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff;
            transition: width linear;
        }

        .story-header {
            position: absolute;
            top: 35px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .story-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .story-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .story-username {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 600;
            color: transparent;
            letter-spacing: 0.8px;
            user-select: none;
        }

        .story-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: none !important;
            transition: background 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .story-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .story-media-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .story-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1.03);
        }

        .story-image.active {
            opacity: 1;
            transform: scale(1);
        }

        .story-nav-left, .story-nav-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 8;
            cursor: none !important;
        }

        .story-nav-left { left: 0; }
        .story-nav-right { right: 0; }

        /* ==========================================
           PAGE CENTERING & LAYOUT WRAPPER (CARD + AD)
           ================================---------- */
        .page-center-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 2;
        }

        /* ==========================================
           MAIN CARD & TILT WRAPPER (Default Tilt Applied)
           ================================---------- */
        .tilt-wrapper {
            perspective: 2500px;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: cardDescent 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardDescent {
            0% { opacity: 0; transform: translateY(80px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0px) scale(1); }
        }

        .zenith-card {
            width: 420px;
            background: rgba(5, 5, 12, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border-radius: 16px;
            overflow: visible;
            box-shadow: 0 50px 120px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 15px rgba(165, 180, 252, 0.02);
            transform: translateZ(0) rotateX(10deg) rotateY(-12deg);
            will-change: transform, box-shadow, border-color;
            text-align: center;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            position: relative;
        }

        .zenith-card:hover {
            border-color: rgba(165, 180, 252, 0.3);
            box-shadow: 0 60px 140px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 20px rgba(165, 180, 252, 0.05);
        }

        /* ==========================================
           BANNER SECTION
           ================================---------- */
        .card-banner {
            width: 100%;
            height: 135px;
            position: relative;
            overflow: hidden;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            transition: height 0.4s ease;
        }

        .card-banner.no-banner {
            height: 45px;
            background: transparent;
            border-bottom: none;
        }

        .card-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1.1) saturate(1.4);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .zenith-card:hover .card-banner img {
            transform: scale(1.08);
        }

        .card-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: linear-gradient(to top, rgba(5, 5, 12, 0.98), transparent);
        }

        .card-banner.no-banner::after {
            display: none;
        }

        .card-body-content {
            padding: 0 30px 26px 30px;
            margin-top: -52px;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        .zenith-card.banner-missing .card-body-content {
            margin-top: -30px;
        }

        /* ==========================================
           AVATAR & CLEAN STATUS
           ================================---------- */
        .avatar-container {
            position: relative;
            width: 92px;
            height: 92px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none !important;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(5, 5, 12, 0.95);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 6px rgba(255,255,255,0.03);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .avatar-container:hover .avatar {
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 10px rgba(165, 180, 252, 0.08);
            transform: scale(1.02);
        }

        /* ==========================================
           USERNAME
           ================================---------- */
        .username-row {
            margin-bottom: 6px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .username {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 10%, #e0e7ff 45%, #c7d2fe 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(165, 180, 252, 0.25));
            line-height: 1.1;
            display: inline-block;
            text-align: center;
            padding: 2px 10px;
        }

        /* ==========================================
           BADGES
           ================================---------- */
        .badges-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
        }

        .badge-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .badge-item {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .badge-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px) scale(0.95);
            background: rgba(10, 10, 18, 0.92);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(165, 180, 252, 0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 999999;
            backdrop-filter: blur(10px);
        }

        .badge-wrapper:hover .badge-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .badge-dev { color: #38bdf8; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5)); }
        .badge-partner { color: #818cf8; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.5)); }

        /* ==========================================
           TYPEWRITER BIO SECTION
           ================================---------- */
        .bio-container {
            font-size: 14.5px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 18px;
            min-height: 24px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-align: center;
            width: 100%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .typewriter-cursor {
            display: inline-block;
            background-color: #ffffff;
            width: 1.5px;
            height: 15px;
            margin-left: 3px;
            animation: blinkCursor 0.8s infinite;
            vertical-align: middle;
            box-shadow: 0 0 6px #ffffff;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==========================================
           SOCIAL BUTTONS & DOCK
           ================================---------- */
        .social-dock {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
            width: 100%;
        }

        .social-icon-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            cursor: none !important;
            backdrop-filter: blur(30px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
        }

        .social-icon-btn.discord:hover { color: #5865F2; border-color: rgba(88, 101, 242, 0.75); }
        .social-icon-btn.tiktok:hover { color: #EE1D52; border-color: rgba(238, 29, 82, 0.75); }
        .social-icon-btn.github:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.75); }

        .website-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.9px;
            margin-bottom: 14px;
            cursor: none !important;
            backdrop-filter: blur(30px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
        }

        /* ==========================================
           CARD FOOTER
           ================================---------- */
        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 12px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            width: 100%;
        }

        .views-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .views-box i {
            color: rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
        }
    </style>
</head>
<body>

    <!-- Ambient Orbs -->
    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Locked Tiny White Dot Cursor -->
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Volume Control -->
    <div class="top-left-volume-container" id="topLeftVolumeContainer">
        <button class="volume-mute-btn" id="volumeMuteBtn" title="Mute/Unmute">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
        </button>
        <div class="volume-slider-wrapper">
            <input type="range" min="0" max="1" step="0.01" value="0.7" class="volume-slider" id="volumeSlider">
        </div>
        <span class="volume-percentage" id="volumePercentage">70%</span>
    </div>

    <!-- Cinematic Background System -->
    <div class="bg-system">
        <video class="bg-video" autoplay muted loop playsinline id="bgVideo">
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="bg-image" id="bgFallbackImage"></div>
        <div class="bg-overlay"></div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content" id="splashClickTrigger">
            <p>Click anywhere to enter</p>
        </div>
    </div>

    <!-- Story Modal -->
    <div class="story-modal" id="storyModal">
        <div class="story-container">
            <div class="story-progress-bars" id="storyProgressBars"></div>
            <div class="story-header">
                <div class="story-user-info">
                    <img src="pfp.png" alt="Avatar" class="story-user-avatar" id="storyUserAvatarImg">
                    <span class="story-username" id="storyHeaderUsername">&nbsp;</span>
                </div>
                <button class="story-close-btn" id="storyCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="story-media-container" id="storyMediaContainer">
                <img src="" alt="Story" class="story-image" id="storyImage">
                <div class="story-nav-left" id="storyNavLeft"></div>
                <div class="story-nav-right" id="storyNavRight"></div>
            </div>
        </div>
    </div>

    <!-- Main Page Center Layout (Card Only) -->
    <div class="page-center-layout">
        
        <!-- Main Card Container -->
        <div class="tilt-wrapper">
            <div class="zenith-card" id="zenithCard">
                
                <div class="card-banner" id="cardBannerContainer">
                    <img src="banner.gif" alt="Banner" id="bannerImg">
                </div>

                <div class="card-body-content">
                    <div class="avatar-container" id="openStoryBtn" title="View Story">
                        <img src="pfp.png" alt="Avatar" class="avatar" id="mainPfpImg">
                    </div>

                    <div class="username-row">
                        <span class="username" id="displayName">why</span>
                    </div>

                    <!-- Badges -->
                    <div class="badges-container">
                        <div class="badge-wrapper">
                            <span class="badge-item badge-dev"><i class="fa-solid fa-code"></i></span>
                            <span class="badge-tooltip">Developer</span>
                        </div>
                        <div class="badge-wrapper">
                            <span class="badge-item badge-partner"><i class="fa-solid fa-handshake"></i></span>
                            <span class="badge-tooltip">Official Partner</span>
                        </div>
                    </div>

                    <div class="bio-container">
                        <span id="typewriterText"></span><span class="typewriter-cursor"></span>
                    </div>

                    <div class="social-dock">
                        <a href="https://discord.gg/semi" target="_blank" class="social-icon-btn discord" id="discordBtn" title="Discord">
                            <i class="fa-brands fa-discord"></i>
                        </a>
                        <a href="https://tiktok.com/@maiyxh" target="_blank" class="social-icon-btn tiktok" id="tiktokBtn" title="TikTok">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                        <a href="https://github.com/believeherlol-max" target="_blank" class="social-icon-btn github" id="githubBtn" title="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </div>

                    <a href="https://semisoftware.xyz" target="_blank" class="website-btn" id="websiteBtn">
                        <span>Visit Our Website</span>
                    </a>

                    <div class="card-footer">
                        <div class="views-box">
                            <i class="fa-solid fa-eye"></i>
                            <span id="viewCount">0</span><span> Views</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        async function loadAssets() {
            const pfpPath = 'pfp.png?v=' + Date.now();
            document.getElementById('mainPfpImg').src = pfpPath;
            document.getElementById('storyUserAvatarImg').src = pfpPath;

            const bannerImg = document.getElementById('bannerImg');
            const bannerContainer = document.getElementById('cardBannerContainer');
            const zenithCard = document.getElementById('zenithCard');

            const testBanner = new Image();
            testBanner.src = 'banner.gif';
            testBanner.onload = () => { bannerImg.src = 'banner.gif'; };
            testBanner.onerror = () => {
                const testPng = new Image();
                testPng.src = 'banner.png';
                testPng.onload = () => { bannerImg.src = 'banner.png'; };
                testPng.onerror = () => {
                    bannerContainer.innerHTML = '';
                    bannerContainer.classList.add('no-banner');
                    zenithCard.classList.add('banner-missing');
                };
            };
        }
        loadAssets();

        let storyImages = [];
        let currentStoryIndex = 0;
        let storyTimer = null;
        const storyDuration = 5000;

        const openStoryBtn = document.getElementById('openStoryBtn');
        const storyModal = document.getElementById('storyModal');
        const storyCloseBtn = document.getElementById('storyCloseBtn');
        const storyImage = document.getElementById('storyImage');
        const storyProgressBars = document.getElementById('storyProgressBars');
        const storyNavLeft = document.getElementById('storyNavLeft');
        const storyNavRight = document.getElementById('storyNavRight');

        function checkActiveStories() {
            return new Promise((resolve) => {
                let list = [];
                const imgBase = new Image();
                imgBase.src = 'story/story.png';
                imgBase.onload = () => {
                    list.push('story/story.png');
                    checkSequentials(1);
                };
                imgBase.onerror = () => { checkSequentials(1); };

                function checkSequentials(index) {
                    const img = new Image();
                    const path = `story/story${index}.png`;
                    img.src = path;
                    img.onload = () => {
                        list.push(path);
                        checkSequentials(index + 1);
                    };
                    img.onerror = () => {
                        storyImages = list;
                        if (storyImages.length > 0) openStoryBtn.classList.add('has-story');
                        resolve();
                    };
                }
            });
        }
        checkActiveStories();

        function buildStoryProgressBars() {
            storyProgressBars.innerHTML = '';
            storyImages.forEach(() => {
                const bar = document.createElement('div');
                bar.className = 'story-progress-bar';
                const fill = document.createElement('div');
                fill.className = 'story-progress-fill';
                bar.appendChild(fill);
                storyProgressBars.appendChild(bar);
            });
        }

        function showStory(index) {
            if (index < 0) index = 0;
            if (index >= storyImages.length) { closeStory(); return; }
            currentStoryIndex = index;
            
            storyImage.classList.remove('active');
            setTimeout(() => {
                storyImage.src = storyImages[currentStoryIndex];
                storyImage.onload = () => { storyImage.classList.add('active'); };
            }, 120);

            const fills = storyProgressBars.querySelectorAll('.story-progress-fill');
            fills.forEach((fill, i) => {
                fill.style.transition = 'none';
                if (i < currentStoryIndex) {
                    fill.style.width = '100%';
                } else if (i === currentStoryIndex) {
                    fill.style.width = '0%';
                    setTimeout(() => {
                        fill.style.transition = `width ${storyDuration}ms linear`;
                        fill.style.width = '100%';
                    }, 50);
                } else {
                    fill.style.width = '0%';
                }
            });

            clearTimeout(storyTimer);
            storyTimer = setTimeout(() => { showStory(currentStoryIndex + 1); }, storyDuration);
        }

        async function openStory(e) {
            e.stopPropagation();
            if (storyImages.length === 0) return;
            buildStoryProgressBars();
            storyModal.classList.add('active');
            showStory(0);
        }

        function closeStory() {
            storyModal.classList.remove('active');
            storyImage.classList.remove('active');
            clearTimeout(storyTimer);
        }

        openStoryBtn.addEventListener('click', openStory);
        storyCloseBtn.addEventListener('click', closeStory);
        storyModal.addEventListener('click', (e) => { if (e.target === storyModal) closeStory(); });
        storyNavLeft.addEventListener('click', (e) => { e.stopPropagation(); showStory(currentStoryIndex - 1); });
        storyNavRight.addEventListener('click', (e) => { e.stopPropagation(); showStory(currentStoryIndex + 1); });

        /* ==========================================
           BACKGROUND FILE FALLBACK HANDLER
           ================================---------- */
        const bgVideo = document.getElementById('bgVideo');
        const bgFallbackImage = document.getElementById('bgFallbackImage');

        bgVideo.addEventListener('error', () => {
            const testImg = new Image();
            testImg.src = 'background.png';
            testImg.onload = () => {
                bgFallbackImage.style.backgroundImage = "url('background.png')";
                bgFallbackImage.style.display = 'block';
                bgVideo.style.display = 'none';
            };
            testImg.onerror = () => {
                bgVideo.style.display = 'block';
                bgFallbackImage.style.display = 'none';
            };
        });

        setTimeout(() => {
            if (bgVideo.networkState === HTMLMediaElement.NETWORK_NO_SOURCE || bgVideo.readyState === 0) {
                const testImg = new Image();
                testImg.src = 'background.png';
                testImg.onload = () => {
                    bgFallbackImage.style.backgroundImage = "url('background.png')";
                    bgFallbackImage.style.display = 'block';
                    bgVideo.style.display = 'none';
                };
            } else {
                bgVideo.style.display = 'block';
            }
        }, 300);

        const splashScreen = document.getElementById('splashScreen');
        const topLeftVolumeContainer = document.getElementById('topLeftVolumeContainer');
        const bgMusic = document.getElementById('bgMusic');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeMuteBtn = document.getElementById('volumeMuteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumePercentage = document.getElementById('volumePercentage');
        let hasInteracted = false;
        let previousVolume = 0.7;

        bgMusic.volume = 0.7;

        function updateVolumeDisplay(val) {
            const percent = Math.round(val * 100);
            volumePercentage.textContent = `${percent}%`;
            if (val === 0) {
                volumeIcon.className = "fa-solid fa-volume-xmark";
            } else if (val < 0.5) {
                volumeIcon.className = "fa-solid fa-volume-low";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high";
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            bgMusic.volume = val;
            updateVolumeDisplay(val);
        });

        volumeMuteBtn.addEventListener('click', () => {
            if (bgMusic.volume > 0) {
                previousVolume = bgMusic.volume;
                bgMusic.volume = 0;
                volumeSlider.value = 0;
                updateVolumeDisplay(0);
            } else {
                bgMusic.volume = previousVolume > 0 ? previousVolume : 0.7;
                volumeSlider.value = bgMusic.volume;
                updateVolumeDisplay(bgMusic.volume);
            }
        });

        async function initializeExperience() {
            if (hasInteracted) return;
            hasInteracted = true;
            bgMusic.play().catch(() => {});
            splashScreen.classList.add('fade-out');
            topLeftVolumeContainer.classList.add('visible');
            setTimeout(() => { splashScreen.remove(); }, 1200);
            startTypewriterSequence();
            initViewCounter();
        }

        window.addEventListener('click', initializeExperience, { once: true });
        window.addEventListener('keydown', initializeExperience, { once: true });

        const sentences = [
            "hi xd lol",
            "busy being rich",
            "heyo"
        ];
        const typewriterElement = document.getElementById('typewriterText');
        let sentenceIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function startTypewriterSequence() {
            const currentSentence = sentences[sentenceIndex];
            if (!isDeleting && charIndex <= currentSentence.length) {
                typewriterElement.textContent = currentSentence.substring(0, charIndex);
                charIndex++;
                setTimeout(startTypewriterSequence, 35);
            } else if (!isDeleting && charIndex > currentSentence.length) {
                setTimeout(() => { isDeleting = true; startTypewriterSequence(); }, 2400);
            } else if (isDeleting && charIndex >= 0) {
                typewriterElement.textContent = currentSentence.substring(0, charIndex);
                charIndex--;
                setTimeout(startTypewriterSequence, 18);
            } else {
                isDeleting = false;
                sentenceIndex = (sentenceIndex + 1) % sentences.length;
                setTimeout(startTypewriterSequence, 300);
            }
        }

        /* ==========================================
           LIVE INFINITE VIEW COUNTER (UPDATED)
           ================================---------- */
        function initViewCounter() {
            const counterElement = document.getElementById('viewCount');
            const STORAGE_KEY = 'zenith_infinite_views_state_v2';
            const FIFTEEN_MINUTES = 15 * 60 * 1000;
            
            let now = Date.now();
            let savedState = JSON.parse(localStorage.getItem(STORAGE_KEY));

            let currentViews = 27726;
            let targetViews = 27726;
            let lastUpdateTime = now;

            if (!savedState) {
                currentViews = 27726;
                targetViews = 27726;
                lastUpdateTime = now;
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentViews, targetViews, lastUpdateTime }));
            } else {
                currentViews = savedState.currentViews;
                targetViews = savedState.targetViews;
                lastUpdateTime = savedState.lastUpdateTime;

                while (now - lastUpdateTime >= FIFTEEN_MINUTES) {
                    let randomIncrement = Math.floor(Math.random() * 12) + 3; // small amounts
                    targetViews += randomIncrement;
                    lastUpdateTime += FIFTEEN_MINUTES;
                }
                
                if (targetViews < currentViews) {
                    targetViews = currentViews;
                }
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentViews: Math.floor(currentViews), targetViews, lastUpdateTime }));
            }

            let displayedValue = currentViews;
            function updateDisplay() {
                if (displayedValue < targetViews) {
                    let diff = targetViews - displayedValue;
                    let step = Math.max(1, Math.ceil(diff / 15));
                    displayedValue += step;
                    if (displayedValue > targetViews) displayedValue = targetViews;
                } else if (displayedValue > targetViews) {
                    displayedValue = targetViews;
                }
                counterElement.textContent = Math.floor(displayedValue).toLocaleString();

                let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
                state.currentViews = displayedValue;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            }

            setInterval(updateDisplay, 50);

            setInterval(() => {
                let randomIncrement = Math.floor(Math.random() * 12) + 3; // small amounts, doesn't stop
                targetViews += randomIncrement;
                lastUpdateTime = Date.now();
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentViews: displayedValue, targetViews, lastUpdateTime }));
            }, FIFTEEN_MINUTES);
        }

        /* ==========================================
           LOCKED CURSOR & SPARKLE TRAIL
           ================================---------- */
        const cursorDot = document.getElementById('cursorDot');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let lastSparkleTime = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

            const now = performance.now();
            if (now - lastSparkleTime > 22) {
                createSparkle(mouseX, mouseY);
                lastSparkleTime = now;
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            
            const randX = (Math.random() - 0.5) * 50;
            const randY = (Math.random() - 0.5) * 50;
            sparkle.style.setProperty('--rand-x', randX);
            sparkle.style.setProperty('--rand-y', randY);

            document.body.appendChild(sparkle);
            setTimeout(() => { sparkle.remove(); }, 600);
        }

        /* ==========================================
           BUTTERY SMOOTH LERP CARD TILT ENGINE
           ================================---------- */
        const zenithCard = document.getElementById('zenithCard');
        let currentRotateX = 10, currentRotateY = -12;
        let targetRotateX = 10, targetRotateY = -12;

        let isHovered = false;
        zenithCard.addEventListener('mouseenter', () => { isHovered = true; });
        zenithCard.addEventListener('mouseleave', () => {
            isHovered = false;
            targetRotateX = 10;
            targetRotateY = -12;
        });

        function smoothTilt() {
            currentRotateX += (targetRotateX - currentRotateX) * 0.06;
            currentRotateY += (targetRotateY - currentRotateY) * 0.06;
            zenithCard.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            requestAnimationFrame(smoothTilt);
        }
        smoothTilt();

        zenithCard.addEventListener('mousemove', (e) => {
            const rect = zenithCard.getBoundingClientRect();
            targetRotateX = -(e.clientY - rect.top - rect.height / 2) / 10;
            targetRotateY = (e.clientX - rect.left - rect.width / 2) / 10;
        });
    </script>
</body>
</html>
