<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>‎ </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-dark: #000000;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --accent-border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            user-select: none;
        }

        .page-enter {
            animation: smoothFadeIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: opacity, transform, filter;
        }

        @keyframes smoothFadeIn {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
                filter: blur(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: auto;
        }

        #particleCanvas { z-index: 0; }

        .glass-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(40px) saturate(140%);
            -webkit-backdrop-filter: blur(40px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 1),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 45px 110px -15px rgba(0, 0, 0, 1),
                        0 0 40px rgba(255, 255, 255, 0.1),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tiny-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: relative;
        }

        .tiny-dot-orange {
            background-color: #f97316;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.8);
            animation: pulseGlow 2.8s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.25); }
        }

        .action-btn {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .action-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-6 selection:bg-white selection:text-black relative page-enter overflow-hidden bg-black">

    <canvas id="particleCanvas"></canvas>

    <!-- MAIN CARD -->
    <div class="w-full max-w-md mx-auto flex flex-col items-center gap-6 relative z-10 text-center my-auto pointer-events-auto">
        <main class="w-full">
            <div class="glass-card w-full p-8 rounded-3xl flex flex-col items-center gap-5 text-center">
                <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-white/[0.03] border border-white/10 shadow-inner">
                    <div class="tiny-dot tiny-dot-orange"></div>
                </div>

                <div class="flex flex-col gap-2">
                    <h2 class="text-xl font-bold tracking-tight text-white uppercase font-mono">Down for Maintenance</h2>
                    <p class="text-xs text-gray-400 leading-relaxed max-w-xs mx-auto">We are currently performing scheduled maintenance. We will be back online soon.</p>
                </div>

                <div class="h-[1px] bg-white/[0.08] w-full my-1"></div>

                <a id="discordBtnLink" href="https://discord.gg/semi" target="_blank" class="action-btn w-full py-3.5 rounded-2xl bg-white text-black hover:bg-gray-200 font-bold text-[11px] tracking-wider uppercase flex items-center justify-center gap-2.5 shadow-xl">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    <span>Join Discord Server</span>
                </a>
            </div>
        </main>
    </div>

    <!-- SCRIPT -->
    <script>
        const bgCanvas = document.getElementById('particleCanvas');
        const bgCtx = bgCanvas.getContext('2d', { alpha: false });
        let bgW, bgH;

        let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.targetX = -1000;
            mouse.targetY = -1000;
        });

        function resizeBgCanvas() {
            bgW = bgCanvas.width = window.innerWidth;
            bgH = bgCanvas.height = window.innerHeight;
            initParticles();
        }

        let tropicalParticles = [];
        function initParticles() {
            tropicalParticles = [];
            const count = Math.min(280, Math.floor((bgW * bgH) / 4500));
            for (let i = 0; i < count; i++) {
                tropicalParticles.push({
                    x: Math.random() * bgW,
                    y: Math.random() * bgH * 0.8,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: -Math.random() * 0.5 - 0.1,
                    radius: Math.random() * 1.8 + 0.3,
                    alpha: Math.random() * 0.6 + 0.1,
                    pulseSpeed: Math.random() * 0.03 + 0.005,
                    pulseAngle: Math.random() * Math.PI * 2
                });
            }
        }

        let waterTime = 0;

        function drawPalmTree(ctx, baseX, baseY, scale, bendRight = true, depthAlpha = 1.0) {
            ctx.save();
            ctx.translate(baseX, baseY);
            ctx.scale(scale, scale);
            ctx.globalAlpha = depthAlpha;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            const bend = bendRight ? 30 : -30;
            ctx.quadraticCurveTo(bend * 0.5, -120, bend, -240);
            ctx.quadraticCurveTo(bend * 0.5 + (bendRight ? 8 : -8), -120, 10, 0);
            ctx.fillStyle = '#050505';
            ctx.fill();

            const cx = bend;
            const cy = -240;

            const frondAngles = bendRight 
                ? [-160, -125, -90, -50, -10, 160, 200, 235] 
                : [-170, -130, -90, -50, -15, 20, 210, 245];

            frondAngles.forEach((angle, idx) => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((angle * Math.PI) / 180);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                const curvePower = 40 + (idx % 3) * 10;
                ctx.quadraticCurveTo(curvePower, -25, curvePower * 2.2, 30);
                ctx.quadraticCurveTo(curvePower * 0.8, -8, 0, 0);
                ctx.fillStyle = '#0a0a0a';
                ctx.fill();

                ctx.beginPath();
                const ribCount = 14;
                for (let i = 1; i <= ribCount; i++) {
                    const progress = i / ribCount;
                    const rx = progress * (curvePower * 2.0);
                    const ry = Math.sin(progress * Math.PI) * -15 + (progress * 25);
                    ctx.moveTo(rx, ry);
                    ctx.lineTo(rx + (bendRight ? 6 : -6), ry + 16);
                }
                ctx.strokeStyle = '#020202';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            });

            ctx.restore();
        }

        function animateBg() {
            waterTime += 0.02;

            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            let skyGrad = bgCtx.createLinearGradient(0, 0, 0, bgH);
            skyGrad.addColorStop(0, '#000000');
            skyGrad.addColorStop(0.35, '#050505');
            skyGrad.addColorStop(0.65, '#0a0a0a');
            skyGrad.addColorStop(0.76, '#111111');
            skyGrad.addColorStop(1, '#000000');
            bgCtx.fillStyle = skyGrad;
            bgCtx.fillRect(0, 0, bgW, bgH);

            const waterY = bgH * 0.74;

            let horizonGlow = bgCtx.createRadialGradient(bgW * 0.5, waterY, 20, bgW * 0.5, waterY, bgW * 0.7);
            horizonGlow.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
            horizonGlow.addColorStop(0.35, 'rgba(180, 180, 180, 0.05)');
            horizonGlow.addColorStop(0.7, 'rgba(50, 50, 50, 0.01)');
            horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = horizonGlow;
            bgCtx.fillRect(0, 0, bgW, bgH);

            if (mouse.x > 0 && mouse.y > 0) {
                let torch = bgCtx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 280);
                torch.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                torch.addColorStop(0.5, 'rgba(150, 150, 150, 0.03)');
                torch.addColorStop(1, 'rgba(0, 0, 0, 0)');
                bgCtx.fillStyle = torch;
                bgCtx.beginPath();
                bgCtx.arc(mouse.x, mouse.y, 280, 0, Math.PI * 2);
                bgCtx.fill();
            }

            for (let p of tropicalParticles) {
                p.y += p.vy;
                p.x += p.vx + Math.sin(waterTime + p.y * 0.01) * 0.15;
                p.pulseAngle += p.pulseSpeed;
                
                const currentAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulseAngle));

                if (p.y < 0) { p.y = waterY; p.x = Math.random() * bgW; }
                if (p.x < 0) p.x = bgW;
                if (p.x > bgW) p.x = 0;

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.7})`;
                bgCtx.fill();
            }

            let waterGrad = bgCtx.createLinearGradient(0, waterY, 0, bgH);
            waterGrad.addColorStop(0, '#080808');
            waterGrad.addColorStop(0.4, '#030303');
            waterGrad.addColorStop(1, '#000000');
            bgCtx.fillStyle = waterGrad;
            bgCtx.fillRect(0, waterY, bgW, bgH - waterY);

            bgCtx.beginPath();
            bgCtx.moveTo(0, waterY);
            bgCtx.lineTo(bgW, waterY);
            bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            bgCtx.lineWidth = 1.2;
            bgCtx.stroke();

            for (let i = 0; i < 22; i++) {
                let lineY = waterY + 4 + (i * i * 0.7);
                if (lineY > bgH) break;

                bgCtx.beginPath();
                bgCtx.moveTo(0, lineY);
                for (let x = 0; x <= bgW; x += 30) {
                    let yOffset = Math.sin((x * 0.012) + waterTime * 1.2 + i * 0.8) * (0.8 + i * 0.18);
                    bgCtx.lineTo(x, lineY + yOffset);
                }
                let alpha = Math.max(0, 0.15 - (i * 0.006));
                bgCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                bgCtx.lineWidth = 1;
                bgCtx.stroke();
            }

            drawPalmTree(bgCtx, bgW * 0.06, waterY + 25, 0.85, true, 0.8);
            drawPalmTree(bgCtx, bgW * 0.01, waterY + 50, 1.2, true, 1.0);
            drawPalmTree(bgCtx, bgW * 0.93, waterY + 30, 0.95, false, 0.8);
            drawPalmTree(bgCtx, bgW * 0.98, waterY + 55, 1.35, false, 1.0);

            requestAnimationFrame(animateBg);
        }

        resizeBgCanvas();
        requestAnimationFrame(animateBg);
        window.addEventListener('resize', resizeBgCanvas);
    </script>
</body>
</html>
