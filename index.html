<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimchi Financial Index // Official Statement</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(18, 18, 24, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Background Glows */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        /* Grid Background Pattern */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* Main Container */
        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 30px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(139, 92, 246, 0.05);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            animation: fadeIn 1s 0.3s forwards;
            opacity: 0;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #a78bfa;
            border-radius: 50%;
            box-shadow: 0 0 8px #a78bfa;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Clown Animation Frame */
        .clown-container {
            position: relative;
            margin-bottom: 25px;
            animation: fadeIn 1s 0.4s forwards;
            opacity: 0;
        }

        .clown-emoji {
            font-size: 5.5rem;
            display: inline-block;
            animation: floatClown 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .clown-emoji:hover {
            transform: scale(1.15) rotate(10deg);
        }

        @keyframes floatClown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(-3deg); }
        }

        /* Typography */
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 15px;
            animation: fadeIn 1s 0.5s forwards;
            opacity: 0;
        }

        h1 span {
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .highlight-broken {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            text-shadow: 0 0 30px rgba(244, 63, 94, 0.3);
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 400;
            margin-bottom: 35px;
            animation: fadeIn 1s 0.6s forwards;
            opacity: 0;
        }

        /* Live Ticker Bar */
        .ticker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 16px;
            animation: fadeIn 1s 0.7s forwards;
            opacity: 0;
        }

        .ticker-item {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .ticker-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .ticker-value {
            font-size: 1rem;
            font-weight: 700;
            color: #f43f5e;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 2.2rem; }
            .clown-emoji { font-size: 4.5rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="grid-bg"></div>

    <div class="wrapper">
        <div class="glass-card">
            
            <div class="badge">
                <span class="badge-dot"></span>
                Verified Market Report
            </div>

            <div class="clown-container">
                <div class="clown-emoji" onclick="triggerEffect()">🤡</div>
            </div>

            <h1>Kimchi is <span class="highlight-broken">broke asf</span></h1>
            
            <p>Real-time telemetry confirms absolute zero liquidity reserves remaining.</p>

            <div class="ticker">
                <div class="ticker-item">
                    <span class="ticker-label">Asset Balance</span>
                    <span class="ticker-value">$0.00</span>
                </div>
                <div class="ticker-item" style="text-align: right;">
                    <span class="ticker-label">Credit Rating</span>
                    <span class="ticker-value" style="color: #ef4444;">F- (Unsalvageable)</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        function triggerEffect() {
            const clown = document.querySelector('.clown-emoji');
            clown.style.transform = 'scale(1.3) rotate(360deg)';
            setTimeout(() => {
                clown.style.transform = 'scale(1) rotate(0deg)';
            }, 400);
        }
    </script>
</body>
</html>
