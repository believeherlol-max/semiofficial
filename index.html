<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatSec Update Module</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .terminal {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            white-space: pre;
            border-right: 2px solid #ffffff;
            animation: blink 0.75s step-end infinite;
        }
        .sub-text {
            font-size: 14px;
            color: #888888;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 1.5s;
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="terminal" id="typing-text"></div>
    <div class="sub-text">i made this update screen thought it was pretty cool bye.</div>

    <script>
        const text = 'print("Hello, We are undergoing maintenance please check back soon!")';
        const typingElement = document.getElementById('typing-text');
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                typingElement.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, 20);
            }
        }

        setTimeout(typeWriter, 300);
    </script>
</body>
</html>
